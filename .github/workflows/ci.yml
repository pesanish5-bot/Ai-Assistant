name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node:
    name: Typecheck and Node tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Node tests
        run: node --test tests/*.test.ts
        env:
          NODE_OPTIONS: --max-old-space-size=4096
